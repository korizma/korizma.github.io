<!DOCTYPE html>
<html>
<head>
    <title>CV/Portfolio</title>
    <style>
        .cv-container {
            width: 100%;
            height: 100vh;
        }
        .cv-pdf {
            width: 100%;
            height: 100%;
        }
        .download-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #2d2d2d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="cv-container">
        <object class="cv-pdf" data= "assets/CV.pdf" type="application/pdf">
            <p>Unable to display PDF? 
                <a href="assets/CV.pdf">Download instead</a>
            </p>
        </object>
    </div>
</body>
</html>
